<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400" width="2400" height="2400">
  <!--
    T-SHIRT DESIGN 01: The Corny-Good Rhyme
    "SAVE THE SNAILS / THEY'RE NOT FOR SALE"
    Front-chest placement. Large shell mark above, punchy couplet below.
    Line art, Engraver's Black. Shirt color recommendation: bone / natural.
    Print size: ~10" × 10" at 300 DPI (so 3000px; this SVG works at any res)
  -->

  <!-- Shell mark — large, centered, generous -->
  <g transform="translate(600, 120) scale(10)" fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Reuse primary mark geometry, slightly more open -->
    <path d="M 60 95 C 38 95, 22 80, 22 62 C 22 44, 36 30, 54 28 C 72 26, 86 38, 88 54 C 90 68, 82 80, 70 84 C 60 88, 50 82, 48 72 C 46 62, 52 54, 60 52 C 68 50, 74 56, 74 64 C 74 70, 70 74, 64 74 C 58 74, 56 70, 58 66"/>
    <path d="M 58 66 C 59 63, 62 62, 65 63 C 68 64, 69 67, 68 70 C 67 73, 64 74, 62 73"/>
    <path d="M 54 28 C 56 22, 60 18, 64 16"/>
    <path d="M 64 16 C 67 14, 70 15, 72 18 C 74 21, 74 26, 72 30"/>
    <path d="M 42 88 C 38 92, 34 98, 32 104 C 31 107, 32 110, 34 111 C 36 112, 38 110, 39 107 C 40 104, 42 100, 44 96 C 46 92, 48 90, 50 90"/>
    <path d="M 88 54 C 92 54, 95 56, 95 60 C 95 65, 92 70, 88 74 C 86 76, 84 78, 82 82 C 80 86, 78 90, 76 93 C 74 95, 72 96, 70 95"/>
    <path d="M 72 30 C 74 28, 76 26, 78 27 C 80 28, 80 30, 79 32"/>
    <path d="M 82 42 C 84 40, 87 40, 88 42 C 89 44, 88 46, 86 47"/>
    <path d="M 50 90 C 44 90, 38 88, 34 84 C 30 80, 30 74, 34 70 C 38 66, 44 64, 48 66"/>
  </g>

  <!-- Thin rule -->
  <line x1="400" y1="1160" x2="2000" y2="1160" stroke="#1A1209" stroke-width="4" opacity="0.25"/>

  <!-- SAVE THE SNAILS — headline -->
  <text x="1200" y="1380"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="210" font-weight="normal"
    letter-spacing="30"
    fill="#1A1209"
    text-anchor="middle">SAVE THE</text>

  <text x="1200" y="1600"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="290" font-weight="normal"
    letter-spacing="40"
    fill="#1A1209"
    text-anchor="middle">SNAILS</text>

  <!-- Thin rule -->
  <line x1="400" y1="1680" x2="2000" y2="1680" stroke="#1A1209" stroke-width="4" opacity="0.25"/>

  <!-- THEY'RE NOT FOR SALE — rhyme line -->
  <text x="1200" y="1860"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="130" font-weight="normal"
    letter-spacing="8"
    fill="#1A1209"
    opacity="0.75"
    text-anchor="middle">They're not for sale.</text>

  <!-- Small shell spiral ornament at bottom -->
  <g transform="translate(1200, 2050) scale(3.5)" fill="none" stroke="#1A1209" stroke-width="1.6" opacity="0.3" stroke-linecap="round">
    <path d="M 0 -24 A 24 24 0 0 1 24 0 A 15 15 0 0 1 0 15 A 9 9 0 0 1 -9 0 A 5 5 0 0 1 0 -5 A 3 3 0 0 1 3 0"/>
    <circle cx="0" cy="0" r="1" fill="#1A1209" stroke="none"/>
  </g>

</svg>
