<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2400" width="2400" height="2400">
  <!--
    T-SHIRT DESIGN 05: "Same Molecule"
    Front-chest. Two columns: LEFT = "10,000 snails" with tiny shell silhouettes
    RIGHT = a lab flask with the molecule. Center: a large equals sign.
    Then below: "SAME MOLECULE" in big tracked caps.
    Clean, minimal, targets the connoisseur.
    Shirt color recommendation: black (print in bone/vellum) or purple.
    Provided in Engraver's Black — for black shirt, invert colors.
  -->

  <!-- LEFT: Stack of shells (representative mass) -->
  <g transform="translate(160, 200)" fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round">
    <!-- 9 shell spirals in a loose grid — gestural, not literal -->
    <g opacity="0.7">
      <!-- Shell 1 -->
      <path d="M 60 60 A 50 50 0 0 1 110 110 A 30 30 0 0 1 60 140 A 18 18 0 0 1 42 110 A 12 12 0 0 1 60 98 A 7 7 0 0 1 67 110"/>
      <!-- Shell 2 -->
      <path d="M 200 40 A 42 42 0 0 1 242 82 A 26 26 0 0 1 200 108 A 16 16 0 0 1 184 82 A 10 10 0 0 1 200 72 A 6 6 0 0 1 206 82"/>
      <!-- Shell 3 -->
      <path d="M 80 220 A 38 38 0 0 1 118 258 A 23 23 0 0 1 80 281 A 14 14 0 0 1 66 258 A 9 9 0 0 1 80 249 A 5 5 0 0 1 85 258"/>
      <!-- Shell 4 -->
      <path d="M 220 200 A 34 34 0 0 1 254 234 A 21 21 0 0 1 220 255 A 12 12 0 0 1 208 234 A 8 8 0 0 1 220 226 A 5 5 0 0 1 225 234"/>
      <!-- Shell 5 — smaller -->
      <path d="M 140 150 A 28 28 0 0 1 168 178 A 17 17 0 0 1 140 195 A 11 11 0 0 1 129 178 A 6 6 0 0 1 140 172 A 4 4 0 0 1 144 178"/>
      <!-- Shell 6 -->
      <path d="M 40 350 A 32 32 0 0 1 72 382 A 20 20 0 0 1 40 402 A 12 12 0 0 1 28 382 A 7 7 0 0 1 40 375 A 4 4 0 0 1 44 382"/>
      <!-- Shell 7 -->
      <path d="M 180 330 A 36 36 0 0 1 216 366 A 22 22 0 0 1 180 388 A 13 13 0 0 1 167 366 A 8 8 0 0 1 180 358 A 5 5 0 0 1 185 366"/>
      <!-- Shell 8 -->
      <path d="M 100 420 A 26 26 0 0 1 126 446 A 16 16 0 0 1 100 462 A 10 10 0 0 1 90 446 A 6 6 0 0 1 100 440 A 3 3 0 0 1 103 446"/>
      <!-- Shell 9 -->
      <path d="M 240 390 A 30 30 0 0 1 270 420 A 18 18 0 0 1 240 438 A 11 11 0 0 1 229 420 A 7 7 0 0 1 240 413 A 4 4 0 0 1 244 420"/>
    </g>

    <!-- Label: "10,000 snails" -->
    <text x="150" y="550"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="70" letter-spacing="4" fill="#1A1209" text-anchor="middle"
      opacity="0.6">10,000</text>
    <text x="150" y="630"
      font-family="Georgia, 'Times New Roman', serif"
      font-style="italic"
      font-size="56" letter-spacing="2" fill="#1A1209" text-anchor="middle"
      opacity="0.4">snails</text>
  </g>

  <!-- CENTER: Enormous equals sign -->
  <text x="1200" y="750"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="500" fill="#1A1209" text-anchor="middle" opacity="0.15">=</text>

  <!-- RIGHT: Lab flask with molecule -->
  <g transform="translate(1740, 180)" fill="none" stroke="#1A1209" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flask body (scaled up) -->
    <path d="M 100 40 L 100 200 L 30 340 C 16 366, 28 400, 60 400 L 360 400 C 392 400, 404 366, 390 340 L 320 200 L 320 40"/>
    <line x1="70" y1="40" x2="350" y2="40" stroke-width="18"/>
    <!-- Liquid -->
    <path d="M 46 340 C 100 326, 260 326, 374 340" stroke-width="8" opacity="0.3"/>
    <!-- Molecule symbol inside: a simplified indigo double-ring -->
    <g transform="translate(130, 260)" stroke-width="10">
      <circle cx="50" cy="50" r="36"/>
      <circle cx="130" cy="50" r="36"/>
      <line x1="86" y1="50" x2="94" y2="50"/>
    </g>
  </g>

  <!-- Label: "1 synthetic" -->
  <text x="2040" y="760"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="70" letter-spacing="4" fill="#1A1209" text-anchor="middle"
    opacity="0.6">1 flask</text>
  <text x="2040" y="840"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="56" letter-spacing="2" fill="#1A1209" text-anchor="middle"
    opacity="0.4">fermentation</text>

  <!-- Bottom: the punchline -->
  <line x1="160" y1="1040" x2="2240" y2="1040" stroke="#1A1209" stroke-width="6" opacity="0.2"/>

  <text x="1200" y="1220"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220" font-weight="normal"
    letter-spacing="30"
    fill="#1A1209"
    text-anchor="middle">SAME</text>

  <text x="1200" y="1480"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="220" font-weight="normal"
    letter-spacing="30"
    fill="#1A1209"
    text-anchor="middle">MOLECULE.</text>

  <line x1="160" y1="1560" x2="2240" y2="1560" stroke="#1A1209" stroke-width="4" opacity="0.2"/>

  <text x="1200" y="1660"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="80" fill="#1A1209" text-anchor="middle" opacity="0.4">6,6′-dibromoindigo</text>

</svg>
