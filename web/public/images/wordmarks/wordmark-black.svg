<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!--
    Wordmark only — Snail Welfare Alliance
    Engraver's Black on transparent.
  -->

  <!-- Thin rule above -->
  <line x1="0" y1="12" x2="320" y2="12" stroke="#1A1209" stroke-width="0.7" opacity="0.3"/>

  <!-- SNAIL WELFARE (smaller, tracked wide) -->
  <text
    x="160" y="38"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="16"
    font-weight="normal"
    letter-spacing="8"
    fill="#1A1209"
    text-anchor="middle">SNAIL WELFARE</text>

  <!-- ALLIANCE (large, generous tracking) -->
  <text
    x="160" y="66"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="30"
    font-weight="normal"
    letter-spacing="10"
    fill="#1A1209"
    text-anchor="middle">ALLIANCE</text>

  <!-- Thin rule below -->
  <line x1="0" y1="76" x2="320" y2="76" stroke="#1A1209" stroke-width="0.7" opacity="0.3"/>

</svg>
