<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <!--
    Spot illustration 2: Single empty cracked murex shell, solitary
    The aperture gaping, hollow inside — what's left after the gland is removed
    Minimal, stark. No caption needed.
  -->
  <g fill="none" stroke="#1A1209" stroke-linecap="round" stroke-linejoin="round">

    <!-- Shadow cast on ground — faint ellipse -->
    <ellipse cx="100" cy="148" rx="44" ry="8" stroke-width="0.6" opacity="0.2"/>

    <!-- Shell body -->
    <path d="M 100 128
      C 72 128, 54 112, 54 90
      C 54 68, 70 52, 90 48
      C 110 44, 128 56, 130 74
      C 132 90, 122 106, 108 112
      C 96 118, 82 112, 80 100
      C 78 88, 86 78, 98 78
      C 110 78, 118 86, 116 98"
      stroke-width="1.6"/>

    <!-- Inner hollow — larger opening than healthy shell (aperture widened by breakage) -->
    <path d="M 100 128
      C 90 128, 78 122, 70 112
      C 62 102, 60 88, 66 78
      C 72 68, 82 64, 90 68"
      stroke-width="1.6"/>

    <!-- Interior void hatching — emptiness -->
    <path d="M 68 92 C 74 94, 80 94, 86 92" stroke-width="0.7" opacity="0.4"/>
    <path d="M 66 102 C 74 104, 82 104, 88 102" stroke-width="0.7" opacity="0.4"/>
    <path d="M 68 112 C 76 114, 84 114, 90 112" stroke-width="0.7" opacity="0.4"/>
    <path d="M 72 122 C 80 124, 88 124, 94 122" stroke-width="0.7" opacity="0.4"/>

    <!-- Spire -->
    <path d="M 90 48 C 92 38, 96 28, 100 22" stroke-width="1.6"/>
    <path d="M 100 22 C 102 16, 106 12, 110 12 C 114 12, 118 16, 118 24 C 118 30, 116 38, 112 46"
      stroke-width="1.6"/>

    <!-- Siphonal canal, tip broken off -->
    <path d="M 72 118 C 66 126, 60 134, 58 142" stroke-width="1.5"/>
    <path d="M 58 142 C 57 145, 58 147, 60 146" stroke-width="1.2"/>
    <!-- Broken tip fragment, fallen -->
    <path d="M 60 146 C 63 148, 66 148, 68 146" stroke-width="1.0"/>

    <!-- Outer lip, slightly chipped -->
    <path d="M 130 74 C 136 74, 140 78, 140 86 C 140 96, 134 108, 126 116 C 120 122, 112 128, 106 130"
      stroke-width="1.6"/>
    <!-- Chip/break on outer lip -->
    <path d="M 138 88 C 140 86, 142 84, 140 82" stroke-width="1.0"/>

    <!-- Suture lines -->
    <path d="M 60 86 C 70 82, 82 78, 96 78 C 110 78, 122 82, 130 86" stroke-width="0.9"/>
    <path d="M 64 70 C 74 66, 84 63, 96 63 C 108 63, 118 66, 126 70" stroke-width="0.8"/>

    <!-- Main crack — the extraction wound -->
    <path d="M 96 50 C 92 64, 90 82, 92 100 C 94 116, 98 128, 100 128"
      stroke-width="1.1" opacity="0.85"/>
    <!-- Branching fracture lines -->
    <path d="M 92 72 C 84 70, 76 72, 70 76" stroke-width="0.7" opacity="0.65"/>
    <path d="M 92 90 C 84 88, 78 90, 74 96" stroke-width="0.7" opacity="0.65"/>

  </g>
</svg>
