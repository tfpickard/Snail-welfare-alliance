<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <!--
    Hero Illustration: The Contrast Pair
    LEFT: A living Purpura pansa on a rock — the Mexican non-lethal method.
          A single luminous drop of purple welling from the intact, living snail.
    RIGHT: A mound of cracked, empty Bolinus brandaris shells — Murex Hill, Sidon.
    Separated by negative space at center. Line art, Engraver's Black strokes.
    Background: Vellum (#F5F0E8). Accent wash of Tyrian Purple on the left drop only.
  -->
  <rect width="900" height="480" fill="#F5F0E8"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- LEFT PANEL: Living snail on rock, purple drop -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(60, 60)">

    <!-- Rock surface — layered strata lines -->
    <path d="M 20 340 C 60 335, 120 338, 180 336 C 240 334, 300 337, 340 340"
      fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 10 350 C 50 346, 130 349, 200 347 C 270 345, 330 348, 360 352"
      fill="none" stroke="#1A1209" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
    <path d="M 0 362 C 50 358, 150 361, 220 359 C 290 357, 360 360, 380 365"
      fill="none" stroke="#1A1209" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>

    <!-- Rock texture — fissure lines -->
    <path d="M 80 340 C 82 348, 86 356, 90 362" fill="none" stroke="#1A1209" stroke-width="0.7" opacity="0.4"/>
    <path d="M 160 337 C 163 345, 165 353, 168 360" fill="none" stroke="#1A1209" stroke-width="0.7" opacity="0.4"/>
    <path d="M 240 340 C 242 348, 246 356, 249 364" fill="none" stroke="#1A1209" stroke-width="0.7" opacity="0.4"/>
    <!-- Rock edge silhouette -->
    <path d="M 30 330 C 50 322, 100 318, 160 320 C 220 322, 290 326, 350 330"
      fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Living snail — Purpura pansa, shell on back, intact -->
    <!-- Shell (rounded, smaller than murex — Purpura is smoother) -->
    <g transform="translate(130, 200)">
      <!-- Shell outer whorl -->
      <path d="M 20 50
        C 5 45, -8 34, -8 20
        C -8 6, 4 -4, 18 -6
        C 32 -8, 44 2, 46 16
        C 48 28, 40 40, 30 44
        C 22 48, 14 44, 12 36
        C 10 28, 16 22, 24 22
        C 30 22, 34 26, 32 32"
        fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner whorl -->
      <path d="M 32 32 C 33 29, 30 26, 27 27 C 24 28, 23 31, 25 34"
        fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Spire -->
      <path d="M 20 -6 C 21 -14, 24 -20, 26 -24"
        fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 26 -24 C 27 -26, 30 -26, 31 -24 C 33 -20, 34 -14, 32 -8"
        fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Suture -->
      <path d="M -4 16 C 4 13, 12 12, 20 12 C 28 12, 36 13, 44 16"
        fill="none" stroke="#1A1209" stroke-width="0.8" opacity="0.7"/>
    </g>

    <!-- Snail body / foot, gently extended -->
    <path d="M 118 250
      C 106 255, 90 260, 76 264
      C 62 268, 50 270, 40 270"
      fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 40 270
      C 42 272, 56 276, 76 276
      C 96 276, 116 272, 132 268
      C 148 264, 158 260, 162 256"
      fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Head / oral lobe -->
    <path d="M 40 270
      C 36 266, 34 260, 36 254
      C 38 248, 44 244, 50 244
      C 56 244, 60 248, 60 254"
      fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Tentacles -->
    <path d="M 42 246 C 38 236, 36 226, 35 218" fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 35 218 C 35 215, 37 214, 38 215" fill="none" stroke="#1A1209" stroke-width="1.2"/>
    <path d="M 52 245 C 50 235, 50 225, 51 217" fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 51 217 C 51 214, 53 213, 54 214" fill="none" stroke="#1A1209" stroke-width="1.2"/>

    <!-- THE PURPLE DROP — alive, welling from the pressed snail -->
    <!-- Drop shape: a perfect teardrop, filled with Tyrian Purple, stroke to match -->
    <path d="M 148 258
      C 152 250, 158 244, 162 240
      C 166 236, 168 234, 168 236
      C 168 240, 164 246, 160 252
      C 158 256, 156 260, 155 264
      C 154 267, 153 268, 152 267
      C 150 265, 148 262, 148 258 Z"
      fill="#5C0A3A" fill-opacity="0.85" stroke="#3A0025" stroke-width="1.0"/>

    <!-- Small secondary drop, hanging -->
    <circle cx="155" cy="270" r="3.5"
      fill="#5C0A3A" fill-opacity="0.7" stroke="#3A0025" stroke-width="0.8"/>

    <!-- Luminous halo around drop (subtle wash) -->
    <ellipse cx="158" cy="254" rx="14" ry="18"
      fill="#8B1A5C" fill-opacity="0.08" stroke="none"/>

    <!-- Left panel caption line (fine, centered below composition) -->
    <text x="190" y="395"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="11" letter-spacing="2.5" fill="#1A1209" opacity="0.6"
      text-anchor="middle">PURPLE WITHOUT DEATH</text>
    <text x="190" y="412"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="9.5" letter-spacing="1.5" fill="#1A1209" opacity="0.4"
      text-anchor="middle">Pinotepa de Don Luis, Oaxaca — 3,000 years</text>

  </g>

  <!-- ═══════════════════════════════════════════ -->
  <!-- CENTER DIVIDER: thin vertical rule -->
  <!-- ═══════════════════════════════════════════ -->
  <line x1="450" y1="60" x2="450" y2="420" stroke="#1A1209" stroke-width="0.6" opacity="0.2"/>

  <!-- VS marker -->
  <text x="450" y="250"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="10" letter-spacing="2" fill="#1A1209" opacity="0.25"
    text-anchor="middle">—</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- RIGHT PANEL: Mound of empty cracked shells -->
  <!-- ═══════════════════════════════════════════ -->
  <g transform="translate(480, 60)">

    <!-- Ground line -->
    <path d="M 0 340 C 60 336, 160 338, 260 337 C 320 336, 360 338, 380 340"
      fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Shell 1: large, cracked, at base left -->
    <g transform="translate(60, 240)">
      <path d="M 0 60 C -20 50, -30 30, -20 10 C -10 -10, 10 -18, 30 -10 C 50 -2, 60 18, 54 36 C 48 52, 32 62, 14 62 C -4 62, -18 52, -20 38"
        fill="none" stroke="#1A1209" stroke-width="1.3" stroke-linecap="round"/>
      <!-- Crack line -->
      <path d="M 10 -14 C 8 2, 6 20, 8 36 C 9 44, 12 52, 14 62"
        fill="none" stroke="#1A1209" stroke-width="0.8" opacity="0.8"/>
      <!-- Secondary crack -->
      <path d="M -4 20 C 4 22, 12 20, 20 18" fill="none" stroke="#1A1209" stroke-width="0.7" opacity="0.6"/>
      <!-- Missing fragment: gap in outline -->
      <path d="M 54 36 C 56 40, 54 46, 50 48" fill="none" stroke="#1A1209" stroke-width="0.9"/>
      <!-- Hollow interior — hatching -->
      <path d="M 4 8 C 8 12, 14 16, 20 18" fill="none" stroke="#1A1209" stroke-width="0.6" opacity="0.4"/>
      <path d="M 2 20 C 8 24, 14 26, 20 28" fill="none" stroke="#1A1209" stroke-width="0.6" opacity="0.4"/>
      <path d="M 4 32 C 10 34, 16 36, 22 36" fill="none" stroke="#1A1209" stroke-width="0.6" opacity="0.4"/>
    </g>

    <!-- Shell 2: medium, on its side, above-left -->
    <g transform="translate(30, 175) rotate(-25)">
      <path d="M 0 40 C -14 34, -22 20, -16 8 C -10 -4, 4 -10, 18 -6 C 32 -2, 38 12, 34 24 C 30 36, 18 44, 6 44 C -2 44, -10 40, -14 32"
        fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Spire tip -->
      <path d="M 4 -8 C 6 -16, 10 -20, 12 -22 C 14 -24, 16 -22, 16 -18 C 16 -14, 14 -10, 12 -8"
        fill="none" stroke="#1A1209" stroke-width="1.2" stroke-linecap="round"/>
      <!-- Crack -->
      <path d="M 6 -6 C 4 4, 4 14, 6 24" fill="none" stroke="#1A1209" stroke-width="0.8" opacity="0.7"/>
      <!-- Siphonal canal, broken off -->
      <path d="M -14 32 C -18 38, -20 44, -18 48" fill="none" stroke="#1A1209" stroke-width="1.0"/>
    </g>

    <!-- Shell 3: small fragment, just a partial whorl -->
    <g transform="translate(140, 198) rotate(15)">
      <path d="M 0 30 C -10 25, -16 14, -10 4 C -4 -6, 8 -8, 16 -4 C 24 0, 26 12, 20 22 C 16 28, 8 32, 0 30"
        fill="none" stroke="#1A1209" stroke-width="1.1" stroke-linecap="round"/>
      <!-- Fragment edge — rough, broken -->
      <path d="M 20 22 C 22 26, 20 30, 18 32 C 14 36, 8 36, 4 34"
        fill="none" stroke="#1A1209" stroke-width="1.0"/>
      <!-- Interior void hatch -->
      <path d="M -4 8 C 2 10, 8 10, 12 8" fill="none" stroke="#1A1209" stroke-width="0.6" opacity="0.35"/>
      <path d="M -6 18 C 2 20, 10 20, 16 18" fill="none" stroke="#1A1209" stroke-width="0.6" opacity="0.35"/>
    </g>

    <!-- Shell 4: tip/apex only, scattered -->
    <g transform="translate(220, 210) rotate(-8)">
      <path d="M 0 0 C 2 -8, 6 -16, 8 -22 C 9 -25, 10 -25, 11 -23 C 13 -18, 14 -10, 12 0 C 10 8, 6 14, 2 14 C -2 14, -4 10, -4 4 C -4 -2, -2 -4, 0 0"
        fill="none" stroke="#1A1209" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- Shell 5: large, dominant, center of mound -->
    <g transform="translate(160, 250)">
      <path d="M 10 70
        C -14 64, -28 46, -26 26
        C -24 6, -8 -8, 12 -10
        C 32 -12, 50 2, 52 22
        C 54 40, 42 56, 26 62
        C 14 66, 2 62, -2 52
        C -6 42, 0 32, 12 30
        C 22 28, 30 36, 28 46"
        fill="none" stroke="#1A1209" stroke-width="1.4" stroke-linecap="round"/>
      <!-- Spire -->
      <path d="M 12 -10 C 14 -20, 18 -28, 22 -32" fill="none" stroke="#1A1209" stroke-width="1.4"/>
      <path d="M 22 -32 C 24 -36, 28 -36, 30 -32 C 32 -28, 32 -20, 30 -12"
        fill="none" stroke="#1A1209" stroke-width="1.4"/>
      <!-- Siphonal canal -->
      <path d="M -14 56 C -20 62, -24 70, -26 78" fill="none" stroke="#1A1209" stroke-width="1.3"/>
      <path d="M 26 62 C 30 68, 32 76, 30 82" fill="none" stroke="#1A1209" stroke-width="1.1"/>
      <!-- Suture line -->
      <path d="M -20 22 C -10 18, 2 16, 14 16 C 26 16, 38 18, 48 22"
        fill="none" stroke="#1A1209" stroke-width="0.8" opacity="0.6"/>
      <!-- Crack — the defining feature, this one is broken open -->
      <path d="M 14 -8 C 10 8, 8 26, 10 42 C 11 50, 14 60, 14 70"
        fill="none" stroke="#1A1209" stroke-width="1.1" opacity="0.9"/>
      <!-- Fracture lines spreading from crack -->
      <path d="M 10 20 C 0 18, -8 20, -14 22" fill="none" stroke="#1A1209" stroke-width="0.7" opacity="0.7"/>
      <path d="M 12 36 C 4 38, -2 40, -6 44" fill="none" stroke="#1A1209" stroke-width="0.7" opacity="0.7"/>
      <!-- Empty interior hatching — nothing left inside -->
      <path d="M -4 14 C 2 16, 8 16, 12 14" fill="none" stroke="#1A1209" stroke-width="0.5" opacity="0.3"/>
      <path d="M -8 26 C 0 28, 8 28, 14 26" fill="none" stroke="#1A1209" stroke-width="0.5" opacity="0.3"/>
      <path d="M -10 38 C -2 40, 6 40, 12 38" fill="none" stroke="#1A1209" stroke-width="0.5" opacity="0.3"/>
      <path d="M -8 50 C 0 52, 8 52, 14 50" fill="none" stroke="#1A1209" stroke-width="0.5" opacity="0.3"/>
    </g>

    <!-- Shell 6: small, background, upper right -->
    <g transform="translate(280, 220) rotate(40)">
      <path d="M 0 24 C -8 20, -14 12, -10 4 C -6 -4, 4 -6, 12 -2 C 20 2, 22 12, 18 20 C 14 26, 6 28, 0 24"
        fill="none" stroke="#1A1209" stroke-width="1.0" stroke-linecap="round"/>
      <path d="M 4 -4 C 5 -10, 8 -14, 9 -16 C 10 -18, 12 -17, 12 -14 C 12 -10, 10 -6, 8 -4"
        fill="none" stroke="#1A1209" stroke-width="1.0"/>
    </g>

    <!-- Scattered small shell fragments at base -->
    <ellipse cx="100" cy="340" rx="12" ry="6" fill="none" stroke="#1A1209" stroke-width="0.9" transform="rotate(-10, 100, 340)"/>
    <path d="M 96 338 C 100 336, 106 336, 110 338" fill="none" stroke="#1A1209" stroke-width="0.7"/>

    <ellipse cx="200" cy="338" rx="8" ry="4" fill="none" stroke="#1A1209" stroke-width="0.8" transform="rotate(5, 200, 338)"/>
    <ellipse cx="280" cy="337" rx="10" ry="5" fill="none" stroke="#1A1209" stroke-width="0.9" transform="rotate(-15, 280, 337)"/>
    <path d="M 150 340 C 152 338, 156 338, 158 340" fill="none" stroke="#1A1209" stroke-width="0.7"/>
    <path d="M 240 339 C 243 337, 248 337, 251 339" fill="none" stroke="#1A1209" stroke-width="0.7"/>

    <!-- Right panel caption -->
    <text x="190" y="395"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="11" letter-spacing="2.5" fill="#1A1209" opacity="0.6"
      text-anchor="middle">MUREX HILL</text>
    <text x="190" y="412"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="9.5" letter-spacing="1.5" fill="#1A1209" opacity="0.4"
      text-anchor="middle">Sidon, Phoenicia — 10,000 snails per gram</text>

  </g>

  <!-- Overall title at top -->
  <text x="450" y="36"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13" letter-spacing="4" fill="#1A1209" opacity="0.5"
    text-anchor="middle">THE SAME COLOR</text>

  <!-- Fine border -->
  <rect x="20" y="20" width="860" height="440" fill="none" stroke="#1A1209" stroke-width="0.5" opacity="0.15"/>

</svg>
