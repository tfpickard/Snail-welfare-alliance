<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icon: "Luxury/gold" — coin with shell profile, value inscription -->
  <g fill="none" stroke="#1A1209" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Coin outer ring -->
    <circle cx="32" cy="32" r="24"/>
    <!-- Coin inner ring -->
    <circle cx="32" cy="32" r="20" stroke-width="0.8" opacity="0.5"/>
    <!-- Simplified shell silhouette inside coin -->
    <path d="M 32 44
      C 24 44, 18 38, 18 30
      C 18 22, 24 16, 32 16
      C 40 16, 46 22, 46 30
      C 46 36, 42 42, 36 44"
      stroke-width="1.2"/>
    <!-- Spiral inside -->
    <path d="M 32 36 C 28 36, 26 34, 26 30 C 26 26, 28 24, 32 24 C 36 24, 38 26, 38 30 C 38 33, 36 35, 34 36"
      stroke-width="1.0"/>
    <!-- Value marks -->
    <line x1="32" y1="8" x2="32" y2="4" stroke-width="1.2"/>
    <line x1="32" y1="60" x2="32" y2="56" stroke-width="1.2"/>
    <line x1="8" y1="32" x2="4" y2="32" stroke-width="1.2"/>
    <line x1="60" y1="32" x2="56" y2="32" stroke-width="1.2"/>
  </g>
</svg>
