<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Icon: "Unnecessary" — lab flask with X through it -->
  <g fill="none" stroke="#1A1209" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flask body -->
    <path d="M 24 10 L 24 28 L 12 48 C 10 52, 12 56, 16 56 L 48 56 C 52 56, 54 52, 52 48 L 40 28 L 40 10"/>
    <!-- Flask neck / opening -->
    <line x1="20" y1="10" x2="44" y2="10"/>
    <!-- Liquid level in flask -->
    <path d="M 16 46 C 24 44, 40 44, 48 46" stroke-width="0.9" opacity="0.5"/>
    <!-- "Same molecule" bubbles in flask -->
    <circle cx="26" cy="48" r="2" stroke-width="0.9"/>
    <circle cx="34" cy="50" r="1.5" stroke-width="0.9"/>
    <circle cx="40" cy="47" r="1.8" stroke-width="0.9"/>
    <!-- Diagonal X across -->
    <line x1="10" y1="10" x2="54" y2="54" stroke-width="1.2" opacity="0.4"/>
    <line x1="54" y1="10" x2="10" y2="54" stroke-width="1.2" opacity="0.4"/>
  </g>
</svg>
