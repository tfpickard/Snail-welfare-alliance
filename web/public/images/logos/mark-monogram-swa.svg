<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    SWA monogram — compact mark for Snail Welfare Alliance
    Engraver's Black on transparent. Three letters in tight, elegant arrangement.
    Line art, no fills. Consistent with primary mark family.
  -->

  <!-- Thin border rule -->
  <rect x="4" y="4" width="92" height="92" fill="none" stroke="#1A1209" stroke-width="0.6" opacity="0.25"/>

  <!-- S — left column, full height -->
  <path d="M22 30 C22 30, 34 26, 38 33 C42 40, 30 46, 28 52 C26 58, 34 68, 46 66"
    fill="none" stroke="#1A1209" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- W — center, slightly larger, occupies the full height with V-notch -->
  <polyline points="44,28 48,62 54,44 60,62 64,28"
    fill="none" stroke="#1A1209" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A — right column, full height, crossbar at midpoint -->
  <polyline points="70,68 78,28 86,68"
    fill="none" stroke="#1A1209" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="73" y1="52" x2="83" y2="52"
    stroke="#1A1209" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Thin baseline rule -->
  <line x1="16" y1="72" x2="84" y2="72" stroke="#1A1209" stroke-width="0.6" opacity="0.4"/>

</svg>
