<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <!--
    Spot illustration 4: "10,000 snails per gram" — a single gram weight
    on a scale pan, with tiny silhouetted shell marks filling a mass
    Abstract, evocative, not gory
  -->
  <g fill="none" stroke="#1A1209" stroke-linecap="round" stroke-linejoin="round">

    <!-- Scale platform / base -->
    <rect x="80" y="190" width="160" height="6" rx="2" stroke-width="1.4"/>
    <path d="M 120 190 L 100 180 L 220 180 L 200 190" stroke-width="1.0"/>
    <!-- Platform surface -->
    <ellipse cx="160" cy="180" rx="64" ry="10" stroke-width="1.4"/>

    <!-- Gram weight — a small cylinder sitting on the scale -->
    <rect x="138" y="140" width="44" height="40" rx="4" stroke-width="1.6"/>
    <ellipse cx="160" cy="140" rx="22" ry="7" stroke-width="1.6"/>
    <!-- Weight knob -->
    <ellipse cx="160" cy="136" rx="8" ry="4" stroke-width="1.4"/>
    <line x1="160" y1="130" x2="160" y2="124"/>
    <!-- Weight engraving: "1g" -->
    <text x="160" y="166"
      font-family="Georgia, serif" font-size="12" letter-spacing="1"
      fill="#1A1209" text-anchor="middle" stroke="none">1 g</text>

    <!-- Mass of tiny shell silhouettes accumulating to fill a cloud shape -->
    <!-- Each tiny shell: simplified spiral, ~4px -->
    <!-- Row 1 -->
    <g opacity="0.55" stroke-width="0.7">
      <!-- We use a grid of minimized spiral marks to suggest the 10,000 -->
      <!-- (Illustrative — ~60 shells shown, labeled as representative) -->
