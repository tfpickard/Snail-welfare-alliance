      font-size="10" letter-spacing="2" fill="#1A1209" opacity="0.4"
      text-anchor="middle" stroke="none">one gram of dye</text>

    <!-- Outer dotted boundary of the shell-mass cloud -->
    <ellipse cx="160" cy="90" rx="130" ry="52"
      stroke-width="0.7" opacity="0.15" stroke-dasharray="3 4"/>

