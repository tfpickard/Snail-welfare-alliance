      <path d="M 62 92 A 5 5 0 0 1 67 97 A 3 3 0 0 1 62 100 A 2 2 0 0 1 60 97"/>
      <path d="M 77 82 A 5 5 0 0 1 82 87 A 3 3 0 0 1 77 90 A 2 2 0 0 1 75 87"/>
