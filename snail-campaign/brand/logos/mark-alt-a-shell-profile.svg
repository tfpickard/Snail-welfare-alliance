<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!--
    Alternate mark A: Bolinus brandaris shell in frontal profile view
    More architectural, symmetrical — emphasizes the spiny ridges
    Engraver's Black, line art
  -->
  <g fill="none" stroke="#1A1209" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Central body axis -->
    <line x1="60" y1="8" x2="60" y2="112" stroke-width="0.6" opacity="0.3"/>

    <!-- Main body oval -->
    <ellipse cx="60" cy="60" rx="24" ry="40" stroke-width="1.5"/>

    <!-- Upper spire — tapering tower -->
    <path d="M48 26 C 50 18, 54 12, 58 9 C 59 8, 61 8, 62 9 C 66 12, 70 18, 72 26"/>
    <path d="M52 20 C 54 15, 57 11, 60 10 C 63 11, 66 15, 68 20"/>

    <!-- Suture lines (whorls) -->
    <path d="M36 56 C 42 52, 50 50, 60 50 C 70 50, 78 52, 84 56" stroke-width="0.9"/>
    <path d="M38 44 C 44 40, 51 38, 60 38 C 69 38, 76 40, 82 44" stroke-width="0.9"/>
    <path d="M40 32 C 46 29, 52 27, 60 27 C 68 27, 74 29, 80 32" stroke-width="0.9"/>

    <!-- Siphonal canal — elongated lower extension -->
    <path d="M50 96 C 46 100, 42 106, 40 112" stroke-width="1.5"/>
    <path d="M70 96 C 74 100, 78 106, 80 112" stroke-width="1.5"/>
    <path d="M40 112 C 45 110, 55 108, 60 108 C 65 108, 75 110, 80 112" stroke-width="1.5"/>

    <!-- Outer lip expansion (aperture flare) -->
    <path d="M36 56 C 30 62, 28 72, 32 80 C 36 88, 44 94, 50 96"/>
    <path d="M84 56 C 90 62, 92 72, 88 80 C 84 88, 76 94, 70 96"/>

    <!-- Varices / ribs (3 axial ridges on each side) -->
    <path d="M36 56 C 32 50, 30 42, 32 34 C 34 28, 38 24, 40 32"/>
    <path d="M84 56 C 88 50, 90 42, 88 34 C 86 28, 82 24, 80 32"/>

    <!-- Spines on shoulder (left) -->
    <path d="M36 44 C 29 42, 24 40, 22 38"/>
    <path d="M38 32 C 31 30, 26 28, 23 28"/>
    <path d="M48 26 C 43 22, 39 18, 37 15"/>

    <!-- Spines on shoulder (right, mirrored) -->
    <path d="M84 44 C 91 42, 96 40, 98 38"/>
    <path d="M82 32 C 89 30, 94 28, 97 28"/>
    <path d="M72 26 C 77 22, 81 18, 83 15"/>

    <!-- Mid-body spines (left) -->
    <path d="M36 56 C 28 55, 22 54, 19 55"/>
    <path d="M32 68 C 25 68, 19 68, 16 70"/>

    <!-- Mid-body spines (right) -->
    <path d="M84 56 C 92 55, 98 54, 101 55"/>
    <path d="M88 68 C 95 68, 101 68, 104 70"/>

    <!-- Umbilicus detail -->
    <circle cx="60" cy="60" r="4" stroke-width="0.9"/>

  </g>
</svg>
